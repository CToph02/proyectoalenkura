{% extends 'base.html'%}

{% block content %}
<h1 class="text-2xl">Aquí podrás cambiar tu contraseña</h1>

<form action="{% url 'accounts:pwd_change' %}" method="post">
    {% csrf_token %}
    <div class="max-w-md mx-auto border border-gray-400 rounded-xl p-4 shadow-xl">
        {% for field in form %}
            <div>
              <label class="mb-1 block text-sm dark:text-gray-300">{{ field.label }}</label>
              {{ field }}
              {% if field.help_text %}
              <p class="text-xs text-gray-400">{{ field.help_text }}</p>
              {% endif %}
              {% for error in field.errors %}
              <p class="text-sm text-red-400">{{ error }}</p>
              {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="w-full mt-2 rounded-xl bg-blue-600 hover:bg-blue-700 dark:bg-indigo-600 px-5 py-2 font-semibold text-white shadow-lg transition dark:hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-300">Actualizar contraseña</button>
    </div>
</form>
{% endblock %}
